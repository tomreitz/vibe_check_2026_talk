    <linearGradient id="trivyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <linearGradient id="pcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2cc60" />
      <stop offset="100%" stop-color="#d4a72c" />
    </linearGradient>
    <linearGradient id="victimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b72" />
      <stop offset="100%" stop-color="#f85149" />
