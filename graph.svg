    <line x1="200" y1="150" x2="350" y2="130" />
    <line x1="180" y1="220" x2="350" y2="200" />
  </g>

  <!-- Faded Nodes (Other companies hit in Feb) -->
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <circle cx="200" cy="150" r="10" />
    <circle cx="180" cy="220" r="12" />
    <circle cx="160" cy="420" r="9" />
    <circle cx="220" cy="480" r="11" />
    <circle cx="350" cy="130" r="8" />
    <circle cx="350" cy="200" r="10" />
