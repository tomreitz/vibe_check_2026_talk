    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="550" y1="0" x2="550" y2="600" />
    <line x1="780" y1="0" x2="780" y2="600" />
  </g>

  <!-- TIMELINE HEADERS -->
  <text x="100" y="40" fill="#8b949e" font-size="12" font-weight="600" letter-spacing="1">PHASE 1: FEB 2026</text>
  <text x="100" y="60" fill="#ff7b72" font-size="16" font-weight="bold">AI Bot Mass Attack</text>

  <text x="435" y="40" fill="#8b949e" font-size="12" font-weight="600" letter-spacing="1">PHASE 2: CLEANUP LULL</text>
  <text x="435" y="60" fill="#f2cc60" font-size="16" font-weight="bold">The Key Interception</text>

  <text x="780" y="40" fill="#8b949e" font-size="12" font-weight="600" letter-spacing="1">PHASE 3: MARCH 19, 2026</text>
  <text x="780" y="60" fill="#f85149" font-size="16" font-weight="bold">Supply Chain Explosion</text>

  <!-- ==================== BACKGROUND / FADED GRAPH SYSTEM ==================== -->
  <!-- Faded Links (Other victims of the Feb bot) -->
  <g stroke="#21262d" stroke-width="1.5" marker-end="url(#arrow-fade)">
    <line x1="100" y1="300" x2="200" y2="150" />
    <line x1="100" y1="300" x2="180" y2="220" />
    <line x1="100" y1="300" x2="160" y2="420" />
    <line x1="100" y1="300" x2="220" y2="480" />
    
