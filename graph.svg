    <circle cx="20" cy="22" r="8" fill="url(#botGrad)"/>
    <text x="35" y="26" font-weight="bold" fill="#ff7b72">AI Bot</text>

    <circle cx="120" cy="22" r="8" fill="url(#trivyGrad)"/>
    <text x="135" y="26" font-weight="bold" fill="#58a6ff">Trivy Path</text>

    <circle cx="250" cy="22" r="8" fill="url(#pcpGrad)"/>
    <text x="265" y="26" font-weight="bold" fill="#f2cc60">TeamPCP</text>

    <circle cx="370" cy="22" r="8" fill="url(#victimGrad)"/>
